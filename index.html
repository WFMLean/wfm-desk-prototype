<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>WFM Desk Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: slim rail + a time-first workspace. The Home "due horizon" plots every open ticket on the clock, because in WFM the question is always how long until it breaches. */
:root{
  --bg:#0C121C; --rail:#0F1621; --panel:#131B29; --panel-2:#192336; --line:#212C42; --line-2:#2C3A56;
  --fg:#E8EDF6; --muted:#8996AE; --faint:#5A6781;
  --accent:#5B7CFF; --accent-fg:#B3C3FF; --accent-bg:#1A2647;
  --ok:#3FCB8C; --ok-bg:#112720; --warn:#F2B13C; --warn-bg:#2A2212; --bad:#F26D67; --bad-bg:#2C181A;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);height:100%}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.logo{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.logo svg{display:block}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:7px 10px;border-radius:6px}
.nav svg{flex:none;opacity:.85}
.nav:hover{background:var(--panel);color:var(--fg)}
.nav.on{background:var(--accent-bg);color:var(--accent-fg)}
.nav .count{margin-left:auto}
.count{background:var(--accent);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;font-variant-numeric:tabular-nums}
.rail h6{margin:16px 10px 6px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.me{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.me b{display:block;color:var(--fg);font-weight:500;font-size:13px}
.av{width:22px;height:22px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line-2);font-size:10px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.av.lg{width:30px;height:30px;font-size:12px;color:var(--accent-fg);background:var(--accent-bg);border-color:var(--accent)}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);min-height:56px}
.top h1{margin:0;font-size:15px;font-weight:600;flex:1;min-width:0}
.kbd{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--muted);width:230px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.kbd:hover{border-color:var(--line-2)}
.btn{border:1px solid var(--line-2);background:transparent;border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#7390FF}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06210F;font-weight:500}
.btn.ok:hover{background:#5CDBA3}
.btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:13px}
.view{flex:1;overflow-y:auto;padding:20px 24px 32px;min-height:0}
.view.flush{padding:0;display:flex;flex-direction:column}
.note{font-size:12px;color:var(--faint);margin:0 0 14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em}
.head p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:2px}
.row .t{min-width:0}
.acts{display:flex;gap:6px;flex-shrink:0}
.kpi .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .d{font-size:12px;margin-top:4px}
.kpi svg{display:block;width:100%;height:34px;margin-top:8px}
.hz{position:relative;height:150px;margin:6px 0 0}
.hz .zone{position:absolute;top:0;bottom:22px;left:0;background:linear-gradient(90deg,var(--bad-bg),transparent);border-right:1px dashed var(--bad)}
.hz .tick{position:absolute;bottom:0;font-size:11px;color:var(--faint);transform:translateX(-50%);white-space:nowrap}
.hz .gl{position:absolute;top:0;bottom:22px;width:1px;background:var(--line)}
.hz .nowl{position:absolute;top:0;bottom:22px;width:2px;background:var(--bad)}
.hz .nowt{position:absolute;top:-2px;font-size:11px;color:var(--bad);transform:translateX(6px)}
.dot{position:absolute;transform:translate(-50%,0);border:0;border-radius:50%;width:14px;height:14px;padding:0;box-shadow:0 0 0 3px var(--panel)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.dot:hover{transform:translate(-50%,0) scale(1.35)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.bar{display:grid;grid-template-columns:96px 1fr 26px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.bar .track{background:var(--panel-2);border-radius:3px;height:6px;display:block;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar.red i{background:var(--bad)}
.pri-d{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pri-d::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pri-d.High{color:var(--bad)} .pri-d.Medium{color:var(--warn)} .pri-d.Low{color:var(--accent-fg)}
.pill{display:inline-flex;align-items:center;border-radius:5px;padding:1px 8px;font-size:12px;white-space:nowrap;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.pill.go{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sla{display:flex;flex-direction:column;gap:3px;min-width:0}
.sla b{font-weight:500;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sla i{display:block;height:3px;border-radius:2px;background:var(--panel-2);overflow:hidden}
.sla i s{display:block;height:100%;text-decoration:none;border-radius:2px}
.sla.ok b{color:var(--ok)} .sla.ok i s{background:var(--ok)}
.sla.warn b{color:var(--warn)} .sla.warn i s{background:var(--warn)}
.sla.bad b{color:var(--bad)} .sla.bad i s{background:var(--bad)}
.sla.done b{color:var(--muted)} .sla.done i s{background:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:14px;padding:3px 12px;color:var(--muted);display:inline-flex;gap:6px}
.chip:hover{border-color:var(--line-2);color:var(--fg)}
.chip.on{background:var(--accent-bg);color:var(--accent-fg);border-color:var(--accent)}
.chip em{font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.on em{color:var(--accent-fg)}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line)}
.tools input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:230px;min-width:0}
.split{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.split.one{grid-template-columns:minmax(0,1fr)}
.listpane{overflow-y:auto;min-width:0}
.tr{display:grid;grid-template-columns:28px 72px minmax(0,2.2fr) minmax(0,1.2fr) 84px 118px 96px 40px;gap:10px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent}
.tr:hover:not(.th){background:var(--panel)}
.tr.sel{background:var(--panel);border-left-color:var(--accent)}
.tr.th{cursor:default;color:var(--faint);font-size:12px;position:sticky;top:0;background:var(--bg);z-index:1;padding-top:8px;padding-bottom:8px}
.tr>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.bulk{display:flex;gap:10px;align-items:center;background:var(--accent-bg);border-bottom:1px solid var(--accent);padding:8px 24px}
.preview{border-left:1px solid var(--line);background:var(--rail);overflow-y:auto;padding:18px;min-width:0}
.preview h2{font-size:16px;margin:6px 0 8px;font-weight:600;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px;margin:14px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:10px;overflow-x:auto;padding:16px 24px 24px;flex:1;scroll-snap-type:x proximity;align-items:start}
.col{background:var(--rail);border:1px solid var(--line);border-radius:10px;padding:10px;scroll-snap-align:start;min-height:160px;transition:border-color .14s}
.col.hot{border-color:var(--accent);background:var(--accent-bg)}
.col h4{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab}
.tc:hover{border-color:var(--line-2)}
.tc.over{border-left:3px solid var(--bad)}
.tc.drag{opacity:.4}
.tc .s{margin:5px 0 8px;line-height:1.35}
.tc .m{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc .m .sla{flex:1}
.crumb{color:var(--muted);font-size:13px;margin-bottom:6px}
.crumb button{background:none;border:0;color:var(--accent-fg);padding:0}
.det{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-top:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.tab{border:0;background:none;color:var(--muted);padding:6px 12px;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-color:var(--accent)}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:0 0 14px 18px;position:relative;border-left:1px solid var(--line);margin-left:5px}
.tl li::before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.tl li.done::before{background:var(--ok)} .tl li.now::before{background:var(--warn)}
.stepper{display:flex;align-items:center;gap:0;margin:2px 0 14px;overflow-x:auto;padding-bottom:4px}
.stepper .s{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;color:var(--muted)}
.stepper .s i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-style:normal}
.stepper .s.done{color:var(--fg)} .stepper .s.done i{background:var(--ok);border-color:var(--ok);color:#06210F}
.stepper .s.now{color:var(--fg)} .stepper .s.now i{border-color:var(--warn);color:var(--warn)}
.stepper .s.no i{background:var(--bad);border-color:var(--bad);color:#2C0B0B}
.stepper .ln{width:26px;height:1px;background:var(--line-2);margin:0 8px;flex:none}
.compose{display:flex;gap:8px;margin-top:10px}
.compose input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.steps{display:flex;gap:8px;margin-bottom:16px;color:var(--faint);font-size:13px;flex-wrap:wrap;align-items:center}
.steps .on{color:var(--fg)} .steps b{font-weight:500}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.type{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.type:hover:not([disabled]){border-color:var(--accent)}
.type[disabled]{opacity:.55;cursor:not-allowed}
.type .c{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
.type b{display:block;font-weight:500;margin:3px 0 4px}
.type small{color:var(--muted);display:block}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;color:var(--muted);font-size:13px}
.form input,.form textarea,.form select,.in{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--fg);min-width:0}
.form textarea{min-height:100px;resize:vertical}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chain .n{border:1px solid var(--line-2);border-radius:5px;padding:1px 9px;font-size:13px}
.next{background:var(--rail)}
.next ol{margin:6px 0 0;padding-left:18px;color:var(--muted)} .next li{margin:6px 0}
.empty{color:var(--muted);padding:28px;text-align:center}
.pal{position:fixed;inset:0;background:rgba(5,8,14,.6);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0;z-index:30}
.pal>div{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;width:min(560px,100%);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pal input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;outline:none;font-size:15px}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow-y:auto}
.pal li button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:10px}
.pal li button:hover,.pal li button.on{background:var(--accent-bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 16px;z-index:40}
.tabbar{display:none}
/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.lg-form{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(20px,6vw,88px);gap:14px;max-width:560px;width:100%;justify-self:center}
.lg-form h1{margin:18px 0 0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.lg-form .form label{color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;width:max-content;max-width:100%}
.seg button{border:0;background:none;color:var(--muted);padding:5px 14px;border-radius:6px}
.seg button.on{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ms{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.ms i{display:grid;grid-template-columns:6px 6px;gap:1px}
.ms i b{width:6px;height:6px;display:block}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.role{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.role:hover{border-color:var(--accent)}
.role b{display:block;font-weight:500} .role small{color:var(--muted)}
.proto{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:7px 10px}
.hint{font-size:12px;color:var(--muted)} .hint.err{color:var(--bad)} .hint.good{color:var(--ok)}
.lg-art{background:var(--rail);border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,5vw,72px);gap:28px;position:relative;overflow:hidden}
.lg-art h2{margin:0;font-size:clamp(26px,3.2vw,40px);line-height:1.12;font-weight:600;letter-spacing:-.025em;text-wrap:balance;max-width:16ch}
.lg-art h2 em{font-style:normal;color:var(--accent-fg)}
.lg-art .hz{height:132px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:620px}
.facts b{display:block;font-weight:500;margin-bottom:2px} .facts span{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.lg-art .dot{animation:pulse 2.6s ease-in-out infinite}.lg-art .dot:nth-child(odd){animation-delay:1.3s}}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--rail),0 0 0 8px var(--line-2)}}
/* autofill + routing */
.auto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--rail);border:1px solid var(--line);border-radius:10px;padding:12px}
.auto .f{min-width:0} .auto .f span{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
.auto .f div,.auto .f select{margin-top:3px;width:100%}
.auto .f select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:4px;padding:1px 7px;background:var(--ok-bg);color:var(--ok)}
.tag.ed{background:var(--warn-bg);color:var(--warn)}
.pick{position:relative}
.pick ul{list-style:none;margin:4px 0 0;padding:4px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;max-height:220px;overflow-y:auto}
.pick li button{width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 9px;display:flex;justify-content:space-between;gap:10px}
.pick li button:hover{background:var(--accent-bg)}
.sugg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sugg b{color:var(--accent-fg);font-weight:500}
.drop{border:1px dashed var(--line-2);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.type.gen{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--accent-bg);border-color:var(--accent)}
.type.gen b{font-size:15px}
.mine{display:grid;gap:10px}
.mreq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;cursor:pointer}
.mreq:hover{border-color:var(--line-2)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.preview{display:none}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail,.kbd{display:none}
  .top{padding:10px 16px}
  .view{padding:16px 16px 96px}
  .tools{padding:10px 16px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g3,.det{grid-template-columns:minmax(0,1fr)}
  .tr.th{display:none}
  .tr{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"c s p" "c t t" "c a l";gap:4px 10px;padding:12px 16px}
  .tr>:nth-child(1){grid-area:c} .tr>:nth-child(2){grid-area:s}

function spark(vals,color,fmt){
  const w=200,h=34,p=3,mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1;

function decide(id,yes){
  const t=T.find(x=>x.id===id); if(!t||t.st!=="pending_approval") return;

}
function move(id,to){
  const t=T.find(x=>x.id===id); if(!t||t.st===to) return;

function vTickets(mine){
  const base=T.filter(t=>!mine||t.who===S.user.short||canDecide(t));
  const chips=[["all","All"],["mine","My queue"],["unas","Unassigned"],["over","Overdue"],["wait","Waiting on me"]];
  const cnt=k=>{const keep=S.chip;S.chip=k;const n=base.filter(chipTest).length;S.chip=keep;return n;};
  const rows=base.filter(t=>chipTest(t)&&(S.q===""||(t.subj+t.type+t.acct+"T-"+t.id).toLowerCase().includes(S.q.toLowerCase())));
  const sel=T.find(t=>t.id===S.sel);
  const n=S.checked.size;
  const list=`<div class="listpane">${n?`<div class="bulk"><b style="font-weight:500">${n} selected</b><button class="btn sm" data-a="bulk" data-k="assign">Assign to me</button><button class="btn sm" data-a="bulk" data-k="resolve">Mark resolved</button><button class="btn sm" data-a="bulk" data-k="csv">Export CSV</button><button class="btn sm" data-a="bulk" data-k="clear">Clear</button></div>`:""}
   <div class="tr th"><span></span><span>Ref</span><span>Subject</span><span>Type</span><span>Priority</span><span>SLA</span><span>Status</span><span>Owner</span></div>
   ${rows.length?rows.map(t=>`<div class="tr ${S.sel===t.id?"sel":""}" data-a="sel" data-id="${t.id}" tabindex="0"><input type="checkbox" data-a="chk" data-id="${t.id}" ${S.checked.has(t.id)?"checked":""} aria-label="Select T-${t.id}"><span>${ref(t)}</span><span>${esc(t.subj)}</span><span class="muted">${esc(t.type)}</span><span>${pri(t.pri)}</span><span>${sla(t)}</span><span><span class="pill">${stLabel(t.st)}</span></span><span>${avatar(t.asg)}</span></div>`).join(""):`<div class="empty">No tickets match this view.</div>`}</div>`;
  const prev=sel?`<aside class="preview"><div class="crumb">${ref(sel)} · ${esc(sel.acct)}</div><h2>${esc(sel.subj)}</h2><div class="chips"><span class="pill">${stLabel(sel.st)}</span>${pri(sel.pri)}</div>
    <div style="margin:14px 0;max-width:240px">${sla(sel)}</div>
    <dl class="kv"><dt>Type</dt><dd>${esc(sel.type)}</dd><dt>Requested by</dt><dd>${esc(sel.who)}</dd><dt>Department</dt><dd>${esc(deptOf(sel))}</dd><dt>Owner</dt><dd>${avatar(sel.asg)}</dd></dl>
    ${chain(sel)}
    <div class="acts" style="margin-top:14px"><button class="btn sm" data-a="open" data-id="${sel.id}">Open full ticket</button>${canDecide(sel)?`<button class="btn sm bad" data-a="no" data-id="${sel.id}">Reject</button><button class="btn sm ok" data-a="yes" data-id="${sel.id}">Approve</button>`:""}</div></aside>`
    :`<aside class="preview"><div class="empty">Select a ticket to preview it here without leaving the list.</div></aside>`;
  return `<div class="tools"><div class="chips">${chips.map(c=>`<button class="chip ${S.chip===c[0]?"on":""}" data-a="chip" data-k="${c[0]}">${c[1]} <em>${cnt(c[0])}</em></button>`).join("")}</div><input type="search" id="q" value="${esc(S.q)}" placeholder="Filter this list" aria-label="Filter tickets"></div>
  <div class="split">${list}${prev}</div>`;
}
function chain(t){
  const roles=Object.keys(t.ap);
  if(!roles.length) return `<div class="muted">No approval needed for this request type.</div>`;
  const steps=[["done","✓","Requested"],...roles.map(r=>[t.ap[r]==="approved"?"done":t.ap[r]==="rejected"?"no":(r===nextRole(t)?"now":""),t.ap[r]==="approved"?"✓":t.ap[r]==="rejected"?"×":"•",r])];
  return `<div class="stepper" aria-label="Approval progress">${steps.map((s,i)=>`${i?'<span class="ln"></span>':""}<span class="s ${s[0]}"><i>${s[1]}</i>${s[2]}</span>`).join("")}</div>`;
}
function vBoard(){
  return `<div class="tools"><span class="muted">Drag a card to change its stage. A ticket can't leave Pending approval until every approver has signed.</span></div>
  <div class="board">${STAGES.map(([k,l])=>{const c=T.filter(t=>t.st===k);return `<section class="col" data-drop="${k}" aria-label="${l}"><h4><span>${l}</span><span class="mono">${c.length}</span></h4>${c.map(t=>`<div class="tc ${isOpen(t)&&t.left<0?"over":""}" draggable="true" data-drag="${t.id}" data-a="open" data-id="${t.id}" tabindex="0"><div style="display:flex;justify-content:space-between">${ref(t)}${pri(t.pri)}</div><div class="s">${esc(t.subj)}</div><div class="m">${sla(t)}${t.asg?avatar(t.asg):""}</div></div>`).join("")||`<div class="muted" style="font-size:12px;padding:6px 2px">Nothing here</div>`}</section>`}).join("")}</div>`;
}

   activity:`<ul class="tl">${t.acts.map(a=>`<li class="done"><b style="font-weight:500">${esc(a.txt)}</b> <span class="muted">· ${esc(a.by)}</span><br><span class="faint">${a.at}</span></li>`).join("")}<li class="done"><b style="font-weight:500">Routed to ${esc(deptOf(t))}</b><br><span class="faint">Today, 8:12</span></li><li class="done"><b style="font-weight:500">Created</b> <span class="muted">· ${esc(t.who)}</span><br><span class="faint">Today, 8:12</span></li></ul>

  <div class="chips" style="gap:12px"><span class="pill">${stLabel(t.st)}</span>${pri(t.pri)}<span style="min-width:150px">${sla(t)}</span></div>
  <div class="det"><section class="card"><div class="tabs">${["details","files","activity"].map(k=>`<button class="tab ${S.tab===k?"on":""}" data-a="tab" data-k="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>${body}</section>
   <aside class="card"><h3>Approvals</h3>${chain(t)}
    <h3 style="margin-top:12px">Stage</h3><select class="in" id="mv" style="width:100%" aria-label="Move ticket to stage">${STAGES.map(s=>`<option value="${s[0]}" ${s[0]===t.st?"selected":""}>${s[1]}</option>`).join("")}</select>
    <h3 style="margin-top:14px">Owner</h3><div>${avatar(t.asg)}</div>
    ${canDecide(t)?`<div class="acts" style="margin-top:16px"><button class="btn bad" data-a="no" data-id="${t.id}">Reject</button><button class="btn ok" data-a="yes" data-id="${t.id}">Approve</button></div>`:""}</aside></div>`;

const deptOf=t=>t.dept||typeOf(t).dept||"WFM / Scheduling";

  const f=S.form, tag=f.edited?`<span class="tag ed">Edited</span>`:`<span class="tag">Auto-filled from ${f.src==="roster"?"roster":"your profile"}</span>`;
  return `<div class="auto" id="autocard"><div class="f" style="grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>Employee details</span>${tag}</div>
   <div class="f"><span>Employee</span><div>${esc(f.emp||"")}</div></div>

   <div class="f"><span>Account</span><select id="fa" aria-label="Account">${ACCTS.map(a=>`<option ${f.acct===a?"selected":""}>${a}</option>`).join("")}</select></div>
   <div class="f"><span>Site</span><select id="fsite" aria-label="Site">${SITES.map(a=>`<option ${f.site===a?"selected":""}>${a}</option>`).join("")}</select></div>

function suggHtml(){
  const f=S.form, s=suggestDept(f.subj+" "+f.desc);
  if(!s) return `<span>Start typing and we'll suggest the right team. If unsure, leave it with WFM triage.</span>`;
  return `<span>Suggested: <b>${s.dept}</b> because you mentioned “${esc(s.why)}”.</span>${f.deptTouched&&f.dept!==s.dept?`<button type="button" class="btn sm" data-a="usesugg">Use suggestion</button>`:""}`;
}
function vNew(){
  const labels=["Choose type","Details","Review"];
  const head=`<div class="steps">${labels.map((s,i)=>`<span class="${S.step===i+1?"on":""}"><b>${i+1}</b> ${s}</span>`).join('<span class="faint">/</span>')}</div>`;
  if(S.step===1){
    const q=(S.form.q||"").toLowerCase(), cat=S.form.cat;
    const list=TYPES.filter(t=>!t.general&&(cat==="All"||t.cat===cat)&&(!q||(t.type+t.cat).toLowerCase().includes(q)));
    const gi=TYPES.findIndex(t=>t.general);
    return `<div class="head"><div><h2>New request</h2><p>Pick what you need. Approvers and the target time come with the type.</p></div></div>${head}
    <div class="types" style="margin-bottom:14px"><button class="type gen" data-a="pick" data-k="${gi}"><span><span class="c">Not sure which type?</span><b>General request</b><small>Describe it in your own words. We suggest the right team as you type, and you can change it.</small></span><span class="btn sm pri" aria-hidden="true">Start</span></button></div>
    <input class="in" id="tq" placeholder="Search request types" aria-label="Search request types" value="${esc(S.form.q||"")}" style="width:min(340px,100%)">

    <div class="types">${list.map(t=>`<button class="type" data-a="pick" data-k="${TYPES.indexOf(t)}" ${t.locked&&S.user.role!=="Admin"?"disabled":""}><span class="c">${t.cat}</span><b>${t.type}</b><small>${t.ap.length?"Approvers: "+t.ap.join(" then "):"No approval needed"} · ${t.sla}h target</small>${t.locked&&S.user.role!=="Admin"?`<small style="color:var(--warn);margin-top:4px">${t.locked}</small>`:""}</button>`).join("")||`<div class="empty">No request types match.</div>`}</div>`;
  }
  const ty=TYPES[S.pick], f=S.form, dept=ty.general?(f.dept||"WFM / Scheduling"):ty.dept;
  const next=`<aside class="card next"><h3>What happens next</h3><div class="chain">${ty.ap.length?ty.ap.map(a=>`<span class="n">${a}</span>`).join('<span class="faint">→</span>'):'<span class="muted">No approval needed</span>'}</div><ol><li>Routed to <b style="color:var(--fg);font-weight:500" id="nx-dept">${dept}</b></li><li>${ty.ap.length?"Each approver gets an email link and can decide in one click":"Goes straight to that team's queue"}</li><li>Target time is <b style="color:var(--fg);font-weight:500">${ty.sla} hours</b> from submit</li></ol></aside>`;
  if(S.step===2){
    const canOther=S.user.role!=="Requester";
    const q=(f.eq||"").toLowerCase();
    const matches=ROSTER.filter(r=>!q||(r.name+r.eid+r.acct).toLowerCase().includes(q)).slice(0,6);
    return `<div class="head"><div><h2>${ty.type}</h2><p>${ty.general?"Routed by what you describe":ty.cat}</p></div></div>${head}<div class="grid g21"><form class="form" id="f2" novalidate>
   ${canOther?`<div><div class="hint" style="margin-bottom:6px">Who is this for?</div><div class="seg"><button type="button" class="${f.forWho==="me"?"on":""}" data-a="for" data-k="me">Myself</button><button type="button" class="${f.forWho==="other"?"on":""}" data-a="for" data-k="other">Someone on my team</button></div></div>`:""}
   ${f.forWho==="other"&&!f.picked?`<div class="pick"><label>Find the employee<input id="eq" value="${esc(f.eq||"")}" placeholder="Name, employee ID or account" autocomplete="off"></label><ul id="emplist">${empList(matches)}</ul></div>`:autoCard()}
   ${f.forWho==="other"&&f.picked?`<button type="button" class="btn sm" data-a="repick" style="justify-self:start">Choose a different employee</button>`:""}
   <label>Subject<input id="fs" value="${esc(f.subj)}" placeholder="Short summary" required></label>
   <label>Description<textarea id="fd" placeholder="What is needed, and by when?">${esc(f.desc)}</textarea></label>
   ${ty.general?`<label>Send to<select id="fdept">${["",...DEPTS].map(d=>`<option value="${d}" ${f.dept===d?"selected":""}>${d||"Not sure, let WFM triage it"}</option>`).join("")}</select></label><div class="sugg" id="sugg">${suggHtml()}</div>
   <label>Priority<select id="fp">${["Low","Medium","High"].map(p=>`<option ${f.pri===p?"selected":""}>${p}</option>`).join("")}</select></label>`
   :`<label>Priority<select disabled><option>${ty.pri} (set by request type)</option></select></label>`}
   <div class="drop">Drop files here or <u>browse</u> · PDF, Excel, images up to 25 MB</div>
   <div class="hint err" id="ferr" hidden></div>
   <div class="acts"><button type="button" class="btn" data-a="back">Back</button><button class="btn pri">Review</button></div></form>${next}</div>`;
  }
  return `<div class="head"><div><h2>Review and submit</h2></div></div>${head}<div class="grid g21"><div class="card"><dl class="kv" style="margin:0"><dt>Type</dt><dd>${ty.type}</dd><dt>Subject</dt><dd>${esc(f.subj)}</dd><dt>For</dt><dd>${esc(f.emp)} <span class="mono muted">${esc(f.eid)}</span></dd><dt>Account</dt><dd>${esc(f.acct)} · ${esc(f.site)} ${f.edited?'<span class="tag ed">Edited</span>':'<span class="tag">Auto-filled</span>'}</dd><dt>Team lead</dt><dd>${esc(f.tl||"Not set")}</dd><dt>Routed to</dt><dd>${dept}</dd><dt>Priority</dt><dd>${pri(ty.general?f.pri:ty.pri)}</dd></dl>
   <div class="acts" style="margin-top:16px"><button class="btn" data-a="back">Back</button><button class="btn pri" data-a="submit">Submit request</button></div></div>${next}</div>`;
}

const stub=n=>`<div class="head"><div><h2>${n}</h2></div></div><div class="card"><div class="empty">${n} keeps its current behaviour in this prototype. It gets the same layout, type and colours as the screens you can click.</div></div>`;

const TITLES={home:"Home",mine:"My requests",tickets:"All tickets",board:"Board",reports:"Reports",rules:"Routing rules",accounts:"Accounts",settings:"Settings",new:"New request",detail:"Ticket"};
function draw(){
  const li=!S.user; $("#login").hidden=!li; $("#app").hidden=li; $("#tabbar").hidden=li;
  if(li){ $("#login").innerHTML=vLogin(); return; }
  const allow=NAV_BY_ROLE[S.user.role];
  $$(".nav[data-go],.tabbar button[data-go]").forEach(b=>{ if(b.dataset.go!=="new") b.hidden=!allow.includes(b.dataset.go); });
  $(".rail h6").hidden=S.user.role!=="Admin";
  $("#me-av").textContent=S.user.ini; $("#me-name").textContent=S.user.name; $("#me-role").textContent=S.user.role+" · sample data";
  const v=S.view; $("#title").textContent=TITLES[v]||"WFM Desk";
  $$(".nav,.tabbar button:not(.plus)").forEach(b=>b.classList.toggle("on",b.dataset.go===(v==="detail"?"tickets":v)));
  { const n=T.filter(t=>canDecide(t)).length; $("#c-home").textContent=n; $("#c-home").hidden=!n; }
  const flush=["tickets","mine","board"].includes(v);
  const el=$("#view"); el.classList.toggle("flush",flush);
  el.innerHTML=({home:vHome,mine:()=>vTickets(true),tickets:()=>vTickets(false),board:vBoard,detail:vDetail,new:vNew,reports:()=>stub("Reports"),rules:()=>stub("Routing rules"),accounts:()=>stub("Accounts"),settings:()=>stub("Settings")})[v]();
}
function keepFocus(id){ const n=$("#"+id); if(n){const p=n.selectionStart;n.focus();try{n.setSelectionRange(p,p)}catch(e){}} }

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const a=e.target.closest("[data-a]"); if(!a) return;
  const id=+a.dataset.id, k=a.dataset.k;
  switch(a.dataset.a){
    case "open": S.tab="details"; S.sel=id; go("detail",id); break;
    case "yes": decide(id,true); break;
    case "no": decide(id,false); break;
    case "chip": S.chip=k; draw(); break;
    case "sel": if(e.target.closest("input")) break; S.sel=id; if(window.innerWidth<=1100){ S.tab="details"; go("detail",id); } else draw(); break;
    case "chk": e.stopPropagation(); S.checked.has(id)?S.checked.delete(id):S.checked.add(id); draw(); break;
    case "bulk": bulk(k); break;
    case "tab": S.tab=k; draw(); break;
    case "comment": { const v=$("#cm").value.trim(); if(v){ T.find(t=>t.id===id).acts.unshift({by:S.user.name,txt:v,at:"Just now"}); draw(); } break; }
    case "cat": S.form.cat=k; draw(); break;
    case "pick": S.pick=+k; S.step=2; draw(); break;
    case "back": S.step--; draw(); break;
    case "submit": submit(); break;
    case "pal": palette(); break;
    case "role": S.user=USERS[k]; S.chip="all"; S.sel=null; S.q=""; toast("Signed in as demo "+S.user.role); go("home"); break;
    case "out": S.user=null; S.lt="in"; S.su={}; closePal(); draw(); break;
    case "lt": S.lt=k; S.su={}; draw(); break;
    case "forgot": { const m=$("#lmsg"); m.hidden=false; m.textContent="In the live app, this emails a reset link to the address above."; break; }
    case "for": S.form.forWho=k; if(k==="me"){ Object.assign(S.form,freshForm(),{subj:S.form.subj,desc:S.form.desc,forWho:"me"}); } else { S.form.picked=false; S.form.eq=""; } draw(); break;
    case "emp": { const r=ROSTER.find(x=>x.eid===k); Object.assign(S.form,{emp:r.name,eid:r.eid,acct:r.acct,site:r.site,tl:r.tl,src:"roster",edited:false,picked:true}); draw(); break; }
    case "repick": S.form.picked=false; S.form.eq=""; draw(); break;
    case "usesugg": { const g=suggestDept(S.form.subj+" "+S.form.desc); if(g){ S.form.dept=g.dept; S.form.deptTouched=false; } draw(); break; }
    case "quick": go("new"); S.pick=+k; S.step=2; draw(); break;
    case "pal-go": closePal(); if(a.dataset.t==="n") go(k); else { S.tab="details"; S.sel=+k; go("detail",+k); } break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ S.q=e.target.value; draw(); keepFocus("q"); }
  if(e.target.id==="tq"){ S.form.q=e.target.value; draw(); keepFocus("tq"); }
  if(e.target.id==="pq") palList(e.target.value);
  const id=e.target.id, v=e.target.value;
  if(id==="fs"||id==="fd"){ S.form[id==="fs"?"subj":"desc"]=v; if(TYPES[S.pick]&&TYPES[S.pick].general){ const g=suggestDept(S.form.subj+" "+S.form.desc); if(g&&!S.form.deptTouched){ S.form.dept=g.dept; const sel=$("#fdept"); if(sel) sel.value=g.dept; const nx=$("#nx-dept"); if(nx) nx.textContent=g.dept; } const sg=$("#sugg"); if(sg) sg.innerHTML=suggHtml(); } }
  if(id==="eq"){ S.form.eq=v; const q=v.toLowerCase(); $("#emplist").innerHTML=empList(ROSTER.filter(r=>!q||(r.name+r.eid+r.acct).toLowerCase().includes(q)).slice(0,6)); }
  if(id==="un") S.su.name=v;
  if(id==="ue"){ S.su.email=v; const ok=!v||/@leangroup\.com$/i.test(v.trim()); const h=$("#uehint"); h.className="hint "+(ok?(v?"good":""):"err"); h.textContent=ok?(v?"Looks right.":"Only @leangroup.com addresses can request access."):"Use your @leangroup.com address."; }
});
document.addEventListener("change",e=>{
  const id=e.target.id, v=e.target.value;
  if(id==="mv") move(S.id,v);
  if(id==="fa"||id==="fsite"){ S.form[id==="fa"?"acct":"site"]=v; S.form.edited=true; draw(); }
  if(id==="fdept"){ S.form.dept=v; S.form.deptTouched=true; const nx=$("#nx-dept"); if(nx) nx.textContent=v||"WFM / Scheduling"; $("#sugg").innerHTML=suggHtml(); }
  if(id==="fp") S.form.pri=v;
  if(id==="us"){ S.su.site=v; }
  if(id==="ua"){ S.su.acct=v; S.su.tl=""; draw(); }
  if(id==="ut"){ S.su.tl=v; }
});
document.addEventListener("submit",e=>{
  const id=e.target.id; e.preventDefault();
  if(id==="f2"){ const er=$("#ferr"); const miss=S.form.forWho==="other"&&!S.form.picked?"Choose the employee this request is for.":!S.form.subj.trim()?"Add a short subject so the team knows what this is.":""; if(miss){ er.hidden=false; er.textContent=miss; return; } S.step=3; draw(); }
  if(id==="fin"){ S.user=USERS.wfm; S.chip="all"; toast("Prototype: signed in as demo WFM Analyst"); go("home"); }
  if(id==="fup"){ const su=S.su, er=$("#uerr"); const miss=!(su.name||"").trim()?"Add your full name.":!/@leangroup\.com$/i.test((su.email||"").trim())?"Use your @leangroup.com email.":!su.site?"Choose your site.":!su.acct?"Choose your account.":""; if(miss){ er.hidden=false; er.textContent=miss; return; } su.done=true; draw(); }
});
document.addEventListener("keydown",e=>{
  if(S.user&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); palette(); }
  if(e.key==="Escape") closePal();
  if(e.key==="Enter"&&e.target.matches(".tr,.tc")) e.target.click();
  if(e.key==="Enter"&&e.target.id==="pq"){ const f=$("#layer li button"); if(f) f.click(); }
});
/* drag and drop on the board */
let DRAG=null;
document.addEventListener("dragstart",e=>{ const c=e.target.closest("[data-drag]"); if(!c) return; DRAG=+c.dataset.drag; c.classList.add("drag"); try{e.dataTransfer.setData("text/plain",String(DRAG));e.dataTransfer.effectAllowed="move";}catch(x){} });
document.addEventListener("dragend",()=>{ DRAG=null; $$(".drag,.hot").forEach(n=>n.classList.remove("drag","hot")); });
document.addEventListener("dragover",e=>{ const c=e.target.closest("[data-drop]"); if(c&&DRAG){ e.preventDefault(); $$(".hot").forEach(n=>n!==c&&n.classList.remove("hot")); c.classList.add("hot"); } });
document.addEventListener("drop",e=>{ const c=e.target.closest("[data-drop]"); if(c&&DRAG){ e.preventDefault(); const id=DRAG; DRAG=null; move(id,c.dataset.drop); } });

function bulk(k){
  const ids=[...S.checked];
  if(k==="clear"){ S.checked=new Set(); return draw(); }
  if(k==="assign"){ ids.forEach(i=>{const t=T.find(x=>x.id===i); t.asg=S.user.ini; ASSIGNEES[S.user.ini]=S.user.name;}); toast(ids.length+" assigned to you"); }
  if(k==="resolve"){ let n=0; ids.forEach(i=>{const t=T.find(x=>x.id===i); if(!(t.st==="pending_approval"&&nextRole(t))){t.st="resolved";n++;}}); toast(n+" resolved"+(n<ids.length?", "+(ids.length-n)+" still need approval":"")); }
  if(k==="csv"){ toast("CSV export of "+ids.length+" tickets is available in the real app"); }
  S.checked=new Set(); draw();
}
function submit(){
  const ty=TYPES[S.pick], id=Math.max(...T.map(t=>t.id))+1, ap={}; ty.ap.forEach(a=>ap[a]="");
  T.unshift({id,subj:S.form.subj,type:ty.type,acct:S.form.acct,who:S.user.short,pri:S.form.pri||ty.pri,eid:S.form.eid,site:S.form.site,tl:S.form.tl,emp:S.form.emp,src:S.form.edited?"edited":S.form.src,dept:ty.general?(S.form.dept||"WFM / Scheduling"):ty.dept,st:ty.ap.length?"pending_approval":"assigned",left:ty.sla,sla:ty.sla,asg:"",me:false,ap,acts:[]});
  S.sel=id; toast("Request T-"+id+" submitted"); go("tickets");
}
/* command palette */
function palette(){
  $("#layer").innerHTML=`<div class="pal" id="palbg"><div role="dialog" aria-label="Search"><input id="pq" placeholder="Search tickets, or jump to a page" autocomplete="off" aria-label="Search"><ul id="pl"></ul></div></div>`;
  $("#palbg").addEventListener("mousedown",e=>{ if(e.target.id==="palbg") closePal(); });
  palList(""); $("#pq").focus();
}
function palList(q){
  q=q.toLowerCase();
  const pages=Object.entries(TITLES).filter(([k])=>k!=="detail"&&(!q||TITLES[k].toLowerCase().includes(q))).map(([k,l])=>`<li><button data-a="pal-go" data-t="n" data-k="${k}"><span>${l}</span><span class="faint">Page</span></button></li>`);
  const ts=T.filter(t=>!q||(t.subj+t.type+"T-"+t.id).toLowerCase().includes(q)).slice(0,6).map(t=>`<li><button data-a="pal-go" data-t="t" data-k="${t.id}"><span>${ref(t)} ${esc(t.subj)}</span><span class="faint">${stLabel(t.st)}</span></button></li>`);
  $("#pl").innerHTML=(q?[...ts,...pages]:[...pages,...ts]).join("")||`<li class="empty">Nothing found.</li>`;
}
function closePal(){ $("#layer").innerHTML=""; }
draw();
</script>

</body>
